<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wotagoods Manager</title>
    <meta name="description" content="A local-first web app shell for managing multiple goods collections.">
    <meta name="theme-color" content="#2f6f73">
    <script src="src/bootstrap/language-bootstrap.js"></script>
    <script src="src/bootstrap/theme-bootstrap.js"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="src/styles/app.css">
  </head>
  <body>
    <main class="app-shell" aria-label="Wotagoods Manager">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">W</div>
            <div>
              <h1>Wotagoods</h1>
              <p id="brandSubtitle">Goods manager</p>
            </div>
          </div>

          <nav class="utility-nav-list" id="utilityNavList" aria-label="Application views"></nav>
        </div>

        <div class="navigation-stack">
          <nav class="nav-list" id="primaryNavList" aria-label="Main views"></nav>
        </div>

        <footer class="sidebar-footer">
          <a
            class="sidebar-project-link"
            id="projectRepositoryLink"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View project on GitHub"
          >
            <span class="nav-icon" id="projectRepositoryIcon" aria-hidden="true"></span>
            <span class="nav-label">GitHub</span>
          </a>
        </footer>
      </aside>

      <section class="workspace">
        <header class="view-heading visually-hidden">
          <p id="viewSection">Overview</p>
          <h2 id="viewTitle">Dashboard</h2>
        </header>

        <div class="view-toolbar" id="viewToolbar" hidden>
          <div class="view-toolbar-inner">
            <div class="view-toolbar-actions" id="viewActions"></div>
          </div>
        </div>

        <section
          class="view-panel"
          id="viewPanel"
          aria-labelledby="viewTitle"
          aria-live="polite"
        ></section>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
