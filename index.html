<!doctype html>
<html lang="en" data-accent="green">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Oshimochi</title>
    <meta name="description" content="A local-first web app shell for managing multiple goods collections.">
    <meta name="theme-color" content="#2f6f73">
    <script src="src/bootstrap/language-bootstrap.js"></script>
    <script src="src/bootstrap/theme-bootstrap.js"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/oshimochi-themeable.svg" type="image/svg+xml">
    <link rel="stylesheet" href="src/styles/app.css">
  </head>
  <body>
    <main class="app-shell" aria-label="Oshimochi">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="sidebar-header">
          <div class="brand">
            <svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
              <use href="icons/oshimochi-themeable.svg#oshimochi-mark"></use>
            </svg>
            <h1>
              <span class="visually-hidden" lang="ja">オシもち。</span>
              <svg class="brand-wordmark" viewBox="0 0 1059 256" aria-hidden="true" focusable="false">
                <use href="icons/oshimochi-wordmark.svg#oshimochi-wordmark"></use>
              </svg>
            </h1>
          </div>

          <button
            class="utility-menu-toggle"
            id="utilityMenuToggle"
            type="button"
            aria-controls="utilityMenu"
            aria-expanded="false"
            aria-label="More"
            title="More"
          >
            <span class="utility-menu-icon" id="utilityMenuIcon" aria-hidden="true"></span>
          </button>
        </div>

        <div class="navigation-stack">
          <nav class="nav-list" id="primaryNavList" aria-label="Main views"></nav>
        </div>

        <footer class="sidebar-footer" id="utilityMenu">
          <nav class="utility-nav-list" id="utilityNavList" aria-label="Application views"></nav>
          <div class="utility-separator" aria-hidden="true"></div>
          <a
            class="sidebar-project-link"
            id="projectRepositoryLink"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View project on GitHub"
          >
            <span class="nav-icon" id="projectRepositoryIcon" aria-hidden="true"></span>
            <span class="nav-label">GitHub</span>
            <span class="utility-external-icon" id="projectExternalIcon" aria-hidden="true"></span>
          </a>
        </footer>
      </aside>

      <section class="workspace">
        <header class="view-heading visually-hidden">
          <p id="viewSection">Overview</p>
          <h2 id="viewTitle">Dashboard</h2>
        </header>

        <div class="view-toolbar" id="viewToolbar" hidden>
          <div class="view-toolbar-inner">
            <div class="view-toolbar-actions" id="viewActions"></div>
          </div>
        </div>

        <section
          class="view-panel"
          id="viewPanel"
          aria-labelledby="viewTitle"
          aria-live="polite"
        ></section>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
