<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="oshimochi-title oshimochi-desc">
  <title id="oshimochi-title">Oshimochi</title>
  <desc id="oshimochi-desc">A smiling mochi mascot peeking out beside a hanging tapestry.</desc>
  <!--
    Single source of geometry for every app accent color.
    Inline this SVG into the document to inherit the CSS custom properties below.
    An <img src="..."> is isolated and will show the fallback blue palette.
    The background variable defaults to blue and can use the app accent token.
  -->
  <rect width="512" height="512" rx="104" fill="var(--oshimochi-bg, #348fec)"/>

  <!-- mascot behind the tapestry -->
  <path d="M297 191 C337 170 380 189 406 223 C447 228 472 265 472 304 C492 338 488 387 463 419 C447 448 414 463 376 460 C342 474 309 468 286 448 C261 423 251 381 260 345 L258 268 C257 235 268 209 297 191 Z" fill="var(--oshimochi-white, #ffffff)"/>

  <!-- hanging tapestry: intentionally blank, with generic fabric waves -->
  <path d="M65 151 H291 V420 C246 444 188 433 168 428 C127 416 99 425 65 420 Z" fill="var(--oshimochi-cloth, #ffffff)"/>
  <path d="M65 151 H291 V200 C244 177 219 201 187 204 C139 207 104 231 65 202 Z" fill="var(--oshimochi-soft, #dceeff)"/>
  <path d="M65 362 C125 337 151 356 190 376 C228 395 265 387 291 377 V420 C246 444 188 433 168 428 C127 416 99 425 65 420 Z" fill="var(--oshimochi-soft, #dceeff)"/>
  <path d="M90 131 L177 69 L264 131" fill="none" stroke="var(--oshimochi-white, #ffffff)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="177" cy="69" r="16" fill="var(--oshimochi-white, #ffffff)"/>
  <rect x="43" y="125" width="269" height="30" rx="15" fill="var(--oshimochi-white, #ffffff)"/>

  <!-- face: high contrast even at 48px -->
  <ellipse cx="347" cy="313" rx="8" ry="14" fill="var(--oshimochi-eye, #145bb3)" transform="rotate(13 347 313)"/>
  <ellipse cx="410" cy="320" rx="8" ry="14" fill="var(--oshimochi-eye, #145bb3)" transform="rotate(13 410 320)"/>
  <circle cx="321" cy="346" r="15" fill="var(--oshimochi-cheek, #f6b6c6)"/>
  <circle cx="438" cy="355" r="15" fill="var(--oshimochi-cheek, #f6b6c6)"/>

  <!-- one simple hugging arm, with matching variable outline -->
  <path d="M286 376 C268 359 262 343 266 328 C275 308 296 308 311 322 C320 330 323 337 329 346 C341 364 333 393 315 400 C302 403 292 391 286 376 Z" fill="var(--oshimochi-white, #ffffff)" stroke="var(--oshimochi-outline, #2377da)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- three broad marks, not tiny decorative details -->
  <path d="M388 150 L396 121" stroke="var(--oshimochi-soft, #dceeff)" stroke-width="16" stroke-linecap="round"/>
  <path d="M434 173 L454 150" stroke="var(--oshimochi-soft, #dceeff)" stroke-width="16" stroke-linecap="round"/>
  <path d="M447 219 L475 210" stroke="var(--oshimochi-soft, #dceeff)" stroke-width="16" stroke-linecap="round"/>
</svg>
